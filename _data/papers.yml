  - id: uav-formation
    figure: /images/publications/uav-formation-fig1.png
    figure_alt: 'Figure 1: Two-stage multi-UAV training pipeline with reward-function search, curriculum learning for static and dynamic obstacle avoidance, and real-world deployment.'
    figure_width: 4269
    figure_height: 974
    title: Multi-UAV Behavior-based Formation with Static and Dynamic Obstacles Avoidance via Reinforcement Learning
    authors: >-
      Yuqing Xie\*, Chao Yu\*, **Hongzhi Zang**\*, Feng Gao, Wenhao Tang, Jingyi Huang, Jiayu Chen, Botian Xu, Yi Wu, Yu Wang
    year: 2025
    venue: IROS
    summary: A two-stage reinforcement learning approach to multi-UAV formation control and obstacle avoidance, evaluated
      in simulation and the real world.
    abstract: >-
      Formation control of multiple Unmanned Aerial Vehicles (UAVs) is vital for practical applications.  This paper tackles
      the task of behavior-based UAV formation while avoiding static and dynamic obstacles during directed flight. We present
      a two-stage reinforcement learning (RL) training pipeline to tackle the challenge of multi-objective optimization, large
      exploration spaces, and the sim-to-real gap. The first stage searches in a simplified scenario for a linear utility
      function that balances all task objectives simultaneously, whereas the second stage applies the utility function in
      complex scenarios, utilizing curriculum learning to navigate large exploration spaces. Additionally, we apply an attention-based
      observation encoder to enhance formation maintenance and manage varying obstacle quantity. Experiments in simulation
      and real world demonstrate that our method outperforms planning-based and RL-based baselines regarding collision-free
      rate and formation maintenance in scenarios with static, dynamic, and mixed obstacles.
    links:
      - label: Project
        url: https://sites.google.com/view/uav-formation-with-avoidance
      - label: arXiv
        url: https://arxiv.org/abs/2410.18495
